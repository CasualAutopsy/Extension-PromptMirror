<div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>PromptMirror - Presets</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <div class="title_restorable">
            <span>Preset Manager</span>
            <div class="flex-container marginTop5">
                <div id="alpha_debug_button" class="menu_button fa-solid fa-bug-slash interactable"></div>
                <div id="promptmirror_master_import" class="menu_button fa-solid fa-file-import interactable" disabled=""></div>
                <div id="promptmirror_master_export" class="menu_button fa-solid fa-file-export interactable" disabled=""></div>
            </div>
        </div>
        <strong>Syntax Preset:</strong>
        <div class="flex-container marginTop5">
            <select id="promptmirror_theme_preset" class="text_pole flex1">
                <option value="" selected="">Error - If you see this, make a bug report!</option>
            </select>
            <input id="promptmirror_theme_import_file" type="file" hidden accept=".json" class="displayNone">
            <div id="promptmirror_theme_import" class="menu_button fa-solid fa-file-import interactable" disabled=""></div>
            <div id="promptmirror_theme_export" class="menu_button fa-solid fa-file-export interactable" disabled=""></div>
            <div id="promptmirror_theme_update" class="menu_button fa-solid fa-save interactable"></div>
            <div id="promptmirror_theme_rename" class="menu_button fa-solid fa-pencil interactable"></div>
            <div id="promptmirror_theme_create" class="menu_button fa-solid fa-file-circle-plus interactable"></div>
            <div id="promptmirror_theme_reload" class="menu_button fa-solid fa-arrows-rotate interactable"></div>
            <div id="promptmirror_theme_delete" class="menu_button fa-solid fa-trash-can interactable"></div>
        </div>
        <hr/>

        <strong>Feature Preset:</strong>
        <div class="flex-container marginTop5">
            <select id="promptmirror_feature_preset" class="text_pole flex1">
                <option value="" selected="">Error - If you see this, make a bug report!</option>
            </select>
            <input id="promptmirror_features_import_file" type="file" hidden accept=".json" class="displayNone">
            <div id="promptmirror_feature_import" class="menu_button fa-solid fa-file-import interactable" disabled=""></div>
            <div id="promptmirror_feature_export" class="menu_button fa-solid fa-file-export interactable" disabled=""></div>
            <div id="promptmirror_feature_update" class="menu_button fa-solid fa-save interactable"></div>
            <div id="promptmirror_feature_rename" class="menu_button fa-solid fa-pencil interactable"></div>
            <div id="promptmirror_feature_create" class="menu_button fa-solid fa-file-circle-plus interactable"></div>
            <div id="promptmirror_feature_reload" class="menu_button fa-solid fa-arrows-rotate interactable"></div>
            <div id="promptmirror_feature_delete" class="menu_button fa-solid fa-trash-can interactable"></div>
        </div>
        <hr/>

    </div>
</div>
