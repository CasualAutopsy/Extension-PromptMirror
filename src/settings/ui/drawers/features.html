<div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>PromptMirror - Features</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">

        <div class="title_restorable">
            <span>Gutter Settings</span>
        </div>
        <label class="checkbox_label" for="promptmirror_line_numbers">
            <input id="promptmirror_line_numbers" type="checkbox" class="checkbox"/>
            <small>Show Line Numbers</small>
        </label>
        <br/>

        <div class="title_restorable">
            <span>Highlight Settings</span>
        </div>
        <label class="checkbox_label" for="promptmirror_active_line">
            <input id="promptmirror_active_line" type="checkbox" class="checkbox"/>
            <small>Active Line</small>
        </label>

        <label class="checkbox_label" for="promptmirror_draw_selection">
            <input id="promptmirror_draw_selection" type="checkbox" class="checkbox"/>
            <small>Draw Selection</small>
        </label>

        <label class="checkbox_label" for="promptmirror_selection_match">
            <input id="promptmirror_selection_matches" type="checkbox" class="checkbox"/>
            <small>Selection Matches</small>
        </label>

        <label class="checkbox_label" for="promptmirror_bracket_matching">
            <input id="promptmirror_bracket_matching" type="checkbox" class="checkbox"/>
            <small>Bracket Matching</small>
        </label>
        <hr/>
    </div>
</div>
